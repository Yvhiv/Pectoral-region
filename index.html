let Q=Q1,cur=1,S,order,i,sc,wrong;
const sh=a=>{a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
function menu(){S=0;$('#qbox').innerHTML=`<h2 style="margin-bottom:6px">Choose a quiz</h2><p class="hint" style="margin:0 0 14px">Both are built from the module book.</p><button class="next" style="margin-top:0" onclick="start(2)">Focused: Pectoral region to clavipectoral fascia (${Q2.length} Qs, with cases)</button><button class="next ghost" onclick="start(1)">Quick mixed quiz (${Q1.length} Qs)</button>`}
function start(k){cur=k||cur;Q=cur===2?Q2:Q1;S=1;order=sh(Q.map((_,x)=>x));i=0;sc=0;wrong=[];ask()}
function ask(){const q=Q[order[i]],ops=sh(q[1].map((t,x)=>({t,c:x===q[2]})));
$('#qbox').innerHTML=`<div class="meta"><span>Question ${i+1} of ${Q.length}</span><span>Score ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="q">${q[4]?'<span class="case">Case</span> ':''}${q[0]}</p><div class="opts">${ops.map((o,x)=>`<button class="opt" data-c="${o.c?1:0}"><b>${'ABCD'[x]}</b><span>${o.t}</span></button>`).join('')}</div><div id="fb"></div>`;
$$('.opt').forEach(b=>b.onclick=()=>{$$('.opt').forEach(o=>{o.disabled=true;if(o.dataset.c==='1')o.classList.add('good')});
const ok=b.dataset.c==='1';if(ok)sc++;else{b.classList.add('bad');wrong.push(order[i])}
$('#fb').innerHTML=`<div class="exp"><strong>${ok?'Correct.':'Not quite.'}</strong> ${q[3]}</div><button class="next" id="nx">${i+1<Q.length?'Next question':'See results'}</button>`;
$('#nx').focus();$('#nx').onclick=()=>{i++;i<Q.length?ask():end()}})}
function end(){const p=Math.round(sc/Q.length*100);
$('#qbox').innerHTML=`<div class="bar"><i style="width:100%"></i></div><div class="score">${sc}<span style="font-size:28px;color:var(--mute)">/${Q.length}</span></div><h2 style="margin:8px 0">${p>=90?'Excellent work.':p>=70?'Solid. A little review will lock it in.':'Worth another pass through the Explore tab.'}</h2>
${wrong.length?`<p style="color:var(--mute);margin:12px 0 0">Review the ones you missed:</p><ul class="rev">${wrong.map(x=>`<li>${Q[x][0]}<br><small>Answer: ${Q[x][1][Q[x][2]]}</small></li>`).join('')}</ul>`:'<p>No mistakes. Perfect run.</p>'}
<button class="next" id="again">Try again (shuffled)</button><button class="next ghost" id="mn">Choose another quiz</button><button class="next ghost" id="ex">Back to Explore</button>`;
$('#again').onclick=()=>start(cur);$('#mn').onclick=menu;$('#ex').onclick=()=>tab(1)}
</script></body></html>
